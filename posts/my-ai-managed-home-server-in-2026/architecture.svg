<svg viewBox="0 0 576 528" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="hs26-arch-light-title hs26-arch-light-desc" class="diagram-svg">
<title id="hs26-arch-light-title">My home server in 2026</title>
<desc id="hs26-arch-light-desc">Architecture diagram: a GitHub repository is the single source of truth. The homeserver VM pulls it every hour, the codebox VM sends pull requests to it. Internet and LAN traffic reach the homeserver, which backs up to Backblaze B2 and mounts media from a NAS that also receives weekly VM backups from the Proxmox host.</desc>
